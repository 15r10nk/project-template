_subdirectory: template

_skip_if_exists:
- CHANGELOG.md

_tasks:
- command: [uv, lock]
  when: "{{_copier_operation == 'copy'}}"

_exclude:
- '{% if not use_mkdocs %}docs{% else %}__copier_keep_docs__{% endif %}'
- '{% if not use_mkdocs %}mkdocs.yml{% else %}__copier_keep_mkdocs__{% endif %}'
- '{% if not use_mkdocs %}.github/workflows/docs.yml{% else %}__copier_keep_release_docs__{% endif %}'
- '{% if not use_mkdocs %}.github/workflows/deploy_development_docs.yml{% else %}__copier_keep_development_docs__{% endif %}'
- '{% if not use_mkdocs %}.github/workflows/test_docs.yml{% else %}__copier_keep_test_docs__{% endif %}'
- '{% if not project_main %}src/{{module_name}}/__main__.py{% else %}__copier_keep_main__{% endif %}'

# questions
project_name:
  type: str
  help: What is your project name?

show_project_logo:
  type: bool
  help: Show project logo?
  default: false

module_name:
  type: str
  help: What is your Python module name?
  default: "{{project_name.replace('-','_')}}"


github_user:
  type: str
  help: github user name
  default: 15r10nk

author_name:
  type: str
  help: Author name
  default: Frank Hoffmann

author_email:
  type: str
  help: Author email address
  default: 15r10nk@polarbit.de

project_description:
  type: str
  help: Describe your project

project_main:
  type: bool
  help: Should the project expose an executable command?
  default: false

full_coverage:
  type: bool
  help: hard requirement for 100% test coverage
  default: true

insider_only:
  type: bool
  help: Is this project available to insiders only?
  default: false

use_mkdocs:
  type: bool
  help: use and deploy documentation with mkdocs
  default: true

python_versions:
  type: yaml
  help: supported python versions
  default: "['3.8','3.9','3.10','3.11','3.12','3.13','3.14']"

pypy_versions:
  type: yaml
  default: [pypy3.9, pypy3.10]

min_python_version:
  type: str
  when: false
  help: the minimal supported python version
  default: '{{python_versions[0]}}'

min_py_version:
  type: str
  when: false
  default: "{{'py'+min_python_version.replace('.','')}}"

discord_id:
  type: str
  default: ''

discord_invite_id:
  type: str
  default: ''
