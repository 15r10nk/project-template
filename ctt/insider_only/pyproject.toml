[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
  {name = "Frank Hoffmann", email = "15r10nk@polarbit.de"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy"
]
dependencies = [
]
description = 'cool project'
keywords = []
license = "MIT"
name = "the-project"
readme = "README.md"
requires-python = ">=3.8"
version="0.0.1"

[dependency-groups]
cog = [
  "cogapp>=3.4.1",
]
dev = [
  "commitizen==4.16.5; python_version >= '3.10'",
  "scriv==1.8.0; python_version >= '3.10'",
]



[project.scripts]
the-project = "the_project.__main__:main"


[project.urls]
Documentation = "https://github.com/15r10nk/the-project#readme"
Issues = "https://github.com/15r10nk/the-project/issues"
Source = "https://github.com/15r10nk/the-project"

[tool.black]
target-version = ["py38"]

[tool.commitizen]
major_version_zero = true
tag_format = "v$major.$minor.$patch$prerelease"
version_scheme = "semver2"
version_provider = "pep621"

[tool.scriv]
format = "md"

[tool.coverage.paths]
the_project = ["src/the_project", "*/the-project/src/the_project"]
tests = ["tests", "*/the-project/tests"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "assert False", "raise NotImplemented", "\\.\\.\\."]

[tool.coverage.run]
branch = true
data_file = "$TOP/.coverage"
omit = [
  "src/the_project/__about__.py"
]
parallel = true

[tool.hatch.envs.default]
scripts.test = "pytest {args:tests}"
dependencies = [
  "pytest",
  "pytest-xdist"
]

[tool.hatch.envs.hatch-test]
dependencies = [
  "coverage[toml]>=6.5",
  "coverage-enable-subprocess",
  "pytest",
  "pytest-xdist"
]
env-vars.TOP = "{root}"
default-args = ["tests"]
scripts.run = "coverage run -m pytest {args}"

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]



[tool.hatch.envs.cov]
dependencies = ["coverage[toml]>=6.5"]
detached = true
env-vars.TOP = "{root}"
scripts.test = [
  "- coverage erase",
  "hatch test --cover-quiet {args}",
  "coverage combine",
  "coverage html",
  "coverage report  --fail-under 100 "
]
